<title>Phase-1 Designs Compared</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three maps of one mission side by side on one clock (they stack on a phone), a three-row time strip and the
   control rail under them. Colours follow the project's other replay pages. */
:root{
  --bg:#eef1ee; --land:#d9dfd8; --land2:#c9d2c8; --water:#c6dbec; --ink:#16201d; --ink2:#5b6863;
  --data:#1d5fa8; --t2:#d6403a; --star:#e09a1c; --rail:#ffffff; --track:#d3d9d3;
  --mC:#1d5fa8; --mF:#c98a12; --mD:#8a59cf;
  --c1:#3b82d6; --c2:#2f9e6e; --c3:#e0a019; --c4:#8a59cf; --c5:#0e3d6e; --c6:#c45a7a; --c7:#5b6863; --c8:#d6403a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1517; --land:#212b2e; --land2:#2b373a; --water:#17304a; --ink:#e7ece9; --ink2:#9aa7a2;
  --data:#6aa9ee; --t2:#ff6a5f; --star:#f2b23a; --rail:#182124; --track:#2b373a;
  --mC:#6aa9ee; --mF:#f2b23a; --mD:#b18af0;
  --c1:#6aa9ee; --c2:#4cc08f; --c3:#f2b23a; --c4:#b18af0; --c5:#8fc1ff; --c6:#e58aa8; --c7:#9aa7a2; --c8:#ff6a5f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1517; --land:#212b2e; --land2:#2b373a; --water:#17304a; --ink:#e7ece9; --ink2:#9aa7a2;
  --data:#6aa9ee; --t2:#ff6a5f; --star:#f2b23a; --rail:#182124; --track:#2b373a;
  --mC:#6aa9ee; --mF:#f2b23a; --mD:#b18af0;
  --c1:#6aa9ee; --c2:#4cc08f; --c3:#f2b23a; --c4:#b18af0; --c5:#8fc1ff; --c6:#e58aa8; --c7:#9aa7a2; --c8:#ff6a5f;
  color-scheme:dark }
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 12px/1 var(--mono);letter-spacing:.02em;padding:7px 11px;border-radius:999px;border:1px solid var(--track);
  background:var(--rail);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.panel{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.panel figcaption{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);letter-spacing:.03em;min-height:16px}
.panel figcaption i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.panel figcaption .st{margin-left:4px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.panel canvas{width:100%;display:block;border-radius:8px}
#lanes{width:100%;height:150px;display:block;cursor:pointer}
.rail{display:flex;align-items:center;gap:10px;background:var(--rail);border-radius:10px;padding:8px 10px}
.rail button{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.rail button:hover{background:var(--track)}
.rail button:focus-visible,#speed:focus-visible,#chap:focus-visible{outline:2px solid var(--data);outline-offset:2px}
#play{background:var(--ink);color:var(--bg)}
#play:hover{background:var(--ink2)}
#chap{flex:1 1 auto;min-width:0;height:28px;display:block;cursor:pointer;border-radius:6px}
#clock{flex:0 0 auto;font:600 12px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2);min-width:5ch;text-align:right}
#speed{flex:0 0 90px;width:90px;accent-color:var(--data)}
@media (max-width:520px){#speed{display:none}}
</style>
<nav class="seg" id="chans" aria-label="Channel"></nav>
<section class="panels" id="panels"></section>
<canvas id="lanes" aria-label="The three designs on one time axis; select a time to jump there"></canvas>
<div class="rail">
  <button id="prev" aria-label="Previous event"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="2" y="3" width="2.4" height="12"/><path d="M16 3v12L6 9z"/></svg></button>
  <button id="play" aria-label="Play or pause"><svg id="ico" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M5 3v12l10-6z"/></svg></button>
  <button id="next" aria-label="Next event"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M2 3v12l10-6z"/><rect x="13.6" y="3" width="2.4" height="12"/></svg></button>
  <canvas id="chap" aria-label="Mission time" tabindex="0"></canvas>
  <span id="clock">0:00</span>
  <input id="speed" type="range" min="-2" max="2" step="1" value="0" aria-label="Speed">
</div>
