      if (u > 0.82) { g.globalAlpha = Math.min(1, (u - 0.82) / 0.1); pts(c.path, col.ink, 2.6 * dpr); g.globalAlpha = 1; } }
    star(X(c.ch[0]), Y(c.ch[1]), 11 * dpr, col.bg, col.ink); }
  // tour: transit (dashed) to the start of each cluster's curve, then the curve in the direction flown
  if (ci === 11 || ci === 12) { const q = ci === 11 ? u * 1.1 : 1; let pos = D.bs;
    legs.forEach((l, i) => { const a = i / legs.length, b = (i + 1) / legs.length; if (q <= a) { pos = l.e; return; }
      const f = Math.min(1, (q - a) / (b - a)); g.setLineDash([4 * dpr, 4 * dpr]); g.strokeStyle = col.ink2; g.lineWidth = 1.2 * dpr; g.beginPath();
      g.moveTo(X(pos[0]), Y(pos[1])); const m = lerp(pos, l.s, Math.min(1, f * 2)); g.lineTo(X(m[0]), Y(m[1])); g.stroke(); g.setLineDash([]);
      if (f > 0.5) { const ff = (f - 0.5) * 2; line(l.P, l.C, ff, col.ink, 2.4 * dpr); head(l.P, l.C, ff, col.ink); } pos = l.e; });
    if (q >= 1) { g.setLineDash([4 * dpr, 4 * dpr]); g.strokeStyle = col.ink2; g.beginPath(); g.moveTo(X(pos[0]), Y(pos[1])); g.lineTo(X(D.bs[0]), Y(D.bs[1])); g.stroke(); g.setLineDash([]); } }
  if (ci === MI) mission(mt);
  bs(); scalebar();
  drawLanes(ci === MI ? mt : -1); drawChap(show);
}

function mission(t) {
  // planned curves, faint
  for (const l of legs) { g.globalAlpha = 0.35; line(l.P, l.C, 1, col.ink2, 1.2 * dpr); g.globalAlpha = 1; }
  // River flows of this moment
  const ph = PH();
  for (const k of K) { const c = CL[k]; if (t < c.leave || t > c.leave + c.lastDone + 1) continue;
    const b0 = Math.floor((t - c.leave) / P.binRiver);
    for (let b = b0 - 3; b <= b0; b++) { const fs = c.flowsByBin.get(b); if (!fs) continue; const fade = 1 - (b0 - b) / 4;
      for (const f of fs) { const A = cells[f[1]], B = cells[f[2]]; g.globalAlpha = 0.85 * fade;
        if (f[1] === f[2]) { g.fillStyle = ph[f[3]]; g.beginPath(); g.arc(X(A.x), Y(A.y), Math.min(9, 1.5 + Math.sqrt(f[4])) * dpr, 0, 2 * Math.PI); g.fill(); }
        else { g.strokeStyle = ph[f[3]]; g.lineWidth = Math.min(6, 1 + Math.sqrt(f[4])) * dpr; g.beginPath(); g.moveTo(X(A.x), Y(A.y)); g.lineTo(X(B.x), Y(B.y)); g.stroke(); } } }
    g.globalAlpha = 1; }
  // critical cells: holding ring, matching, hand-over to the CH
  for (const k of K) { const c = CL[k];
    for (const i of c.crit) { const cc = cells[i], x = X(cc.x), y = Y(cc.y), r = 9 * dpr; let v = 0;
      if (t >= c.leave) { const h = c.held[i]; if (h) v = h[Math.min(h.length - 1, Math.max(0, Math.floor((t - c.leave) / P.binHeld)))]; }
      const done = t >= c.leave + c.done[i];
      g.lineWidth = 3 * dpr; g.strokeStyle = col.track; g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.stroke();
      if (v > 0) { g.strokeStyle = done ? col.ink : col.data; g.beginPath(); g.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * (done ? 1 : v)); g.stroke(); }
      const m0 = c.leave + c.done[i];
      if (t >= m0 && t < m0 + P.match) { g.fillStyle = col.match; g.globalAlpha = 0.35 + 0.35 * Math.sin((t - m0) * 6); g.beginPath(); g.arc(x, y, r * 1.6, 0, 2 * Math.PI); g.fill(); g.globalAlpha = 1; }
      const rp = report[i];
      if (t >= m0 + P.match && t < rp.ch + 0.6) { const f = Math.min(1, (t - m0 - P.match) / Math.max(0.1, rp.ch - m0 - P.match)); const chc = cells[c.chCell];
        g.strokeStyle = col.match; g.lineWidth = 2 * dpr; g.beginPath(); g.moveTo(x, y); const e = lerp([cc.x, cc.y], [chc.x, chc.y], f); g.lineTo(X(e[0]), Y(e[1])); g.stroke(); }
      if (t >= rp.ch && t < rp.send) { g.fillStyle = col.match; g.beginPath(); g.arc(X(cells[c.chCell].x), Y(cells[c.chCell].y), 4 * dpr, 0, 2 * Math.PI); g.fill(); } }
    star(X(c.ch[0]), Y(c.ch[1]), 10 * dpr, col.bg, col.ink);
    // LoRa uplink: each send travels from the CH to the BS
    for (const s of c.lora.sends) { if (t < s || t > s + 3) continue; const f = (t - s) / 3; const a = c.ch, b = D.bs;
      g.setLineDash([3 * dpr, 5 * dpr]); g.strokeStyle = col.match; g.lineWidth = 1.6 * dpr; g.beginPath(); g.moveTo(X(a[0]), Y(a[1])); const e = lerp(a, b, f); g.lineTo(X(e[0]), Y(e[1])); g.stroke(); g.setLineDash([]);
      g.beginPath(); g.arc(X(e[0]), Y(e[1]), 4 * dpr, 0, 2 * Math.PI); g.fillStyle = col.match; g.fill(); }
    // the CH's duty-cycle clock: a thin arc that fills over each 40 s window
    const ph0 = c.lora.phase, w = ((t - ph0) % P.gap + P.gap) % P.gap / P.gap;
    if (t >= c.leave) { g.strokeStyle = col.match; g.lineWidth = 2 * dpr; g.globalAlpha = 0.7; g.beginPath(); g.arc(X(c.ch[0]), Y(c.ch[1]), 15 * dpr, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * w); g.stroke(); g.globalAlpha = 1; } }
  // suspects known at the BS
  for (const s of sus) { if (t < s.known) continue; const cc = cells[s.c]; const v = visitAt[s.c];
    const revealed = v !== undefined && t >= v; const color = revealed ? (s.truth ? col.t2 : col.ink2) : col.false;
    g.beginPath(); g.arc(X(cc.x), Y(cc.y), (6 + 10 * s.score) * dpr, 0, 2 * Math.PI); g.fillStyle = color; g.globalAlpha = revealed && !s.truth ? 0.45 : 0.95; g.fill(); g.globalAlpha = 1;
    g.lineWidth = 1.4 * dpr; g.strokeStyle = col.ink; g.stroke(); }
  // team 2 path so far and position
  if (t >= D.dep) { g.strokeStyle = col.t2; g.lineWidth = 2.4 * dpr; g.beginPath(); g.moveTo(X(D.bs[0]), Y(D.bs[1])); let pos = D.bs;
    for (const m of t2) { if (t < m.t0) break; const f = Math.min(1, (t - m.t0) / Math.max(1e-6, m.t1 - m.t0)); pos = lerp(m.a, m.b, f); g.lineTo(X(pos[0]), Y(pos[1])); }
    g.stroke(); const h = t2.find(m => m.hover && t >= m.t0 && t <= m.t1);
    if (h) { g.strokeStyle = col.t2; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(X(pos[0]), Y(pos[1]), (14 + 4 * Math.sin(t * 3)) * dpr, 0, 2 * Math.PI); g.stroke(); }
    if (t <= END) uav(pos, col.t2, 0); }
  // team 1: straight transits, each cluster's curve in the direction flown
  let p1 = D.bs, prev = D.bs, pt = 0;
  for (const l of legs) { if (t < l.t0) { p1 = lerp(prev, l.s, (t - pt) / (l.t0 - pt)); prev = null; break; }
    if (t <= l.t1) { const f = (t - l.t0) / (l.t1 - l.t0); p1 = ptAt(l.P, l.C, f); prev = null; line(l.P, l.C, f, col.data, 2.2 * dpr);
      g.strokeStyle = col.data; g.globalAlpha = 0.25; g.lineWidth = 1.5 * dpr; for (let r = 1; r <= 3; r++) { g.beginPath(); g.arc(X(p1[0]), Y(p1[1]), sc * (180 * r + (t * 300) % 180), 0, 2 * Math.PI); g.stroke(); } g.globalAlpha = 1; break; }
    prev = l.e; pt = l.t1; }
  if (prev) p1 = t < D.back ? lerp(prev, D.bs, (t - pt) / (D.back - pt)) : D.bs;
  if (t < D.back) uav(p1, col.ink, 1);
}

function drawLanes(t) {
  const w = lanes.width, h = lanes.height; gl.fillStyle = col.bg; gl.fillRect(0, 0, w, h);
  gl.globalAlpha = t >= 0 ? 1 : 0.3;
  const rows = legs.length + 2, rh = h / rows, x = v => 4 * dpr + (w - 8 * dpr) * v / END;
  const bar = (r, a, b, color, f = 0.62) => { gl.fillStyle = color; gl.fillRect(x(a), r * rh + rh * (1 - f) / 2, Math.max(1.5 * dpr, x(b) - x(a)), rh * f); };
  // grid every 60 s
  gl.strokeStyle = col.track; gl.lineWidth = 1; for (let s = 0; s < END; s += 60) { gl.beginPath(); gl.moveTo(x(s), 0); gl.lineTo(x(s), h); gl.stroke(); }
  bar(0, 0, D.back, col.ink2, 0.3);
  legs.forEach((l, i) => { const c = CL[l.k], r = i + 1; bar(r, l.t0, l.t1, col.axe); bar(r, l.t1, l.t1 + c.lastDone, col.bank, 0.4);
    for (const s of c.lora.sends) bar(r, s, s + 1.2, col.match, 0.9);
    for (const i2 of c.crit) { const s = sus.find(z => z.c === i2); if (s) { gl.fillStyle = s.truth ? col.t2 : col.false; gl.beginPath(); gl.arc(x(s.known), r * rh + rh / 2, 3.5 * dpr, 0, 2 * Math.PI); gl.fill(); } } });
  const r2 = legs.length + 1; for (const m of t2) bar(r2, m.t0, m.t1, m.hover ? col.ink : col.t2, m.hover ? 0.75 : 0.45);
  gl.globalAlpha = 1;
  if (t >= 0) { gl.strokeStyle = col.ink; gl.lineWidth = 2 * dpr; gl.beginPath(); gl.moveTo(x(t), 0); gl.lineTo(x(t), h); gl.stroke(); }
}
// the step bar: equal-width steps before the mission, the mission gets the rest
const chapGeom = () => { const w = chap.width, gap = 3 * dpr, unit = (w - gap * MI) * 0.55 / MI; return {w, gap, unit, mw: w - gap * MI - unit * MI}; };
function drawChap(show) {
  const h = chap.height, {w, gap, unit, mw} = chapGeom(); gc.clearRect(0, 0, w, h);
  let x = 0; CH.forEach((c, i) => { const ww = i < MI ? unit : mw; const f = Math.max(0, Math.min(1, (show - starts[i]) / (c.d || 1)));
    gc.fillStyle = col.track; gc.fillRect(x, h * 0.3, ww, h * 0.4); gc.fillStyle = col.fill; gc.fillRect(x, h * 0.3, ww * f, h * 0.4); x += ww + gap; });
}
function seekFromChap(px) { const {gap, unit, mw} = chapGeom(); let x = 0;
  for (let i = 0; i <= MI; i++) { const ww = i < MI ? unit : mw; if (px <= x + ww + gap / 2 || i === MI) { show = starts[i] + CH[i].d * Math.max(0, Math.min(1, (px - x) / ww)); dirty = true; return; } x += ww + gap; } }

// ---------- player ----------
let show = 0, playing = false, last = 0, dirty = true, speed = 1;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ico = document.getElementById("ico");
function setPlay(v) { playing = v; ico.innerHTML = v ? '<rect x="4" y="3" width="3.5" height="12"/><rect x="10.5" y="3" width="3.5" height="12"/>' : '<path d="M5 3v12l10-6z"/>'; last = performance.now(); }
document.getElementById("play").onclick = () => { if (show >= TOTAL) show = 0; setPlay(!playing); };
const chapIndex = () => { let i = 0; while (i < MI && show >= starts[i + 1] - 1e-6) i++; return i; };
document.getElementById("next").onclick = () => { const i = chapIndex(); show = i < MI ? starts[i + 1] : TOTAL; dirty = true; };
document.getElementById("prev").onclick = () => { const i = chapIndex(); show = show - starts[i] > 0.5 || i === 0 ? starts[i] : starts[i - 1]; dirty = true; };
document.getElementById("speed").oninput = e => { speed = Math.pow(2, Number(e.target.value)); };
let drag = false; const pick = e => { const r = chap.getBoundingClientRect(); seekFromChap((e.clientX - r.left) * dpr); };
chap.addEventListener("pointerdown", e => { drag = true; chap.setPointerCapture(e.pointerId); pick(e); });
chap.addEventListener("pointermove", e => { if (drag) pick(e); });
chap.addEventListener("pointerup", () => { drag = false; });
chap.addEventListener("keydown", e => { if (e.key === "ArrowRight") document.getElementById("next").click(); if (e.key === "ArrowLeft") document.getElementById("prev").click(); if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); } });
window.addEventListener("resize", fit);
function loop(now) {
  if (playing) { show += (now - last) / 1000 * speed; last = now; if (show >= TOTAL) { show = TOTAL; setPlay(false); } dirty = true; }
  if (dirty) { draw(show); dirty = false; }
  requestAnimationFrame(loop); }
fit();
show = reduce ? starts[MI] + CH[MI].d * 0.35 : starts[MI - 1] + CH[MI - 1].d;   // open on a filled frame: the plan of every cluster
setPlay(false); draw(show); requestAnimationFrame(loop);
})();
</script>
