<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAV-SAR Run Viewer — proposed seed 2</title>
<style>
:root{
  --surface:#fcfcfb; --panel:#f4f4f2; --border:#e2e1dd;
  --text:#0b0b0b; --text2:#52514e; --muted:#8a8983;
  --fast:#2a78d6; --data:#1baf7a; --cl:#4a3aa7; --victim:#e34948;
  --bs:#0b0b0b; --good:#008300; --accent:#2a78d6;
  --evd:#e8842c; --share:#9333ea;
  --cellA:rgba(237,161,0,.10); --cellB:rgba(42,120,214,.08);
  --cellC:rgba(232,123,164,.10); --cellD:rgba(0,131,0,.08);
  --cellE:rgba(74,58,167,.08);  --cellF:rgba(235,104,52,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#1a1a19; --panel:#222220; --border:#3a3936;
    --text:#ffffff; --text2:#c3c2b7; --muted:#8a8983;
    --fast:#3987e5; --data:#199e70; --cl:#9085e9; --victim:#e66767;
    --bs:#e8e7e0; --good:#35c07e; --accent:#3987e5;
    --cellA:rgba(201,133,0,.14); --cellB:rgba(57,135,229,.11);
    --cellC:rgba(213,81,129,.13); --cellD:rgba(53,192,126,.10);
    --cellE:rgba(144,133,233,.12); --cellF:rgba(217,89,38,.13);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);
  font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;padding:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:10px}
header h1{font-size:17px;font-weight:650}
header .sub{color:var(--text2);font-size:12.5px}
.milestones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;min-width:130px}
.tile .lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile.primary .val{color:var(--good)}
.tile .val small{font-size:12px;font-weight:400;color:var(--text2)}
.layout{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.mapwrap{flex:1 1 620px;min-width:340px;display:flex;flex-direction:column;gap:8px}
canvas{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);
  display:block;cursor:crosshair}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls button{background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:6px 16px;font-weight:600;font-size:13px;cursor:pointer}
.controls input[type=range]{flex:1;min-width:150px;accent-color:var(--accent)}
.controls .t{font-variant-numeric:tabular-nums;font-weight:600;min-width:74px}
.controls select{background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:5px 8px}
.side{flex:0 1 330px;min-width:280px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px}
.legend .it{display:flex;align-items:center;gap:6px;color:var(--text2)}
.sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.sw.ring{background:transparent;border:2.5px solid var(--victim);border-radius:50%}
.sw.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:11px solid var(--fast);border-radius:0}
.sw.tri.d{border-bottom-color:var(--data)}
#log{max-height:300px;overflow-y:auto;font-size:12.5px}
#log .row{display:flex;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;align-items:baseline}
#log .row:hover{background:var(--border)}
#log .row.future{opacity:.35}
#log .tt{font-variant-numeric:tabular-nums;color:var(--text2);min-width:52px}
#log .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;position:relative;top:1px}
#metrics{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px}
#metrics .k{color:var(--text2)} #metrics .v{font-variant-numeric:tabular-nums;text-align:right}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:9;max-width:230px;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
</style>
</head>
<body>
<header>
  <h1>UAV-SAR — Mission Replay</h1>
  <span class="sub" id="runinfo"></span>
</header>

<div class="milestones" id="miles"></div>

<div class="layout">
  <div class="mapwrap">
    <canvas id="map" height="560"></canvas>
    <div class="controls">
      <button id="play">Play</button>
      <span class="t" id="tlabel">0.0 s</span>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <select id="speed">
        <option value="1">1×</option><option value="2" selected>2×</option>
        <option value="5">5×</option><option value="10">10×</option>
      </select>
    </div>
    <div class="card"><div class="legend">
      <span class="it"><span class="sw tri"></span>FAST UAV</span>
      <span class="it"><span class="sw tri d"></span>DATA UAV</span>
      <span class="it"><span class="sw" style="background:var(--muted)"></span>sensor</span>
      <span class="it"><span class="sw" style="background:var(--cl);border-radius:50%"></span>Cell Leader</span>
      <span class="it"><span class="sw ring"></span>victim node</span>
      <span class="it"><span class="sw" style="background:var(--bs)"></span>BS</span>
      <span class="it"><span class="sw" style="background:var(--cellA);border:1px solid var(--border)"></span>hex cell (màu theo lớp)</span>
      <span class="it"><span class="sw" style="background:var(--evd);border-radius:50%"></span>node có bằng chứng (đậm = mạnh)</span>
      <span class="it"><span class="sw" style="background:linear-gradient(90deg,var(--evd),transparent);height:3px"></span>RPT → Cell Leader</span>
      <span class="it"><span class="sw" style="background:linear-gradient(90deg,var(--share),transparent);height:3px"></span>sóng SHARE liên-cell</span>
      <span class="it"><span class="sw ring" style="border-color:var(--victim)"></span>region + target giao hàng</span>
    </div></div>
  </div>

  <div class="side">
    <div class="card"><h2>Sự kiện</h2><div id="log"></div></div>
    <div class="card"><h2>Metrics (run)</h2><div id="metrics"></div></div>
  </div>
</div>
<div id="tip"></div>

<script>
"use strict";
/* ---------- parse embedded CSVs ---------- */
function parseCsv(txt){
  const lines = txt.trim().split(/\r?\n/);
  const head = lines[0].split(",");
  return lines.slice(1).map(l=>{
    const c=l.split(","); const o={};
    head.forEach((h,i)=>o[h]=c[i]);
    return o;
  });
}
const METRICS = parseCsv(document.getElementById("csv-metrics").textContent)[0];
const EVENTS  = parseCsv(document.getElementById("csv-events").textContent)
                .map(e=>({t:+e.t,id:+e.nodeId,role:e.role,ev:e.event,det:e.detail,x:+e.x,y:+e.y}));
const TRAJ    = parseCsv(document.getElementById("csv-traj").textContent)
                .map(r=>({t:+r.t,id:+r.uavId,role:r.role,x:+r.x,y:+r.y}));

/* ---------- reconstruct topology (same math as the C++ substrate) ---------- */
const GRID=+METRICS.gridSize, SPACING=20, NUMUAV=+METRICS.numUav;
const FIRST_SENSOR=1+NUMUAV, TARGET=+METRICS.targetNodeId;
const CELL_R=80, NEIGH_R=80, BS={x:-200,y:-200};

const sensors=[];
for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++)
  sensors.push({id:FIRST_SENSOR+i*GRID+j,x:j*SPACING,y:i*SPACING});

/* pointy-top axial hex (identical to cell-grid.cc) */
function worldToAxial(x,y,s){
  const fq=(Math.sqrt(3)/3*x-y/3)/s, fr=(2/3*y)/s, fs=-fq-fr;
  let q=Math.round(fq),r=Math.round(fr),ss=Math.round(fs);
  const dq=Math.abs(q-fq),dr=Math.abs(r-fr),ds=Math.abs(ss-fs);
  if(dq>dr&&dq>ds)q=-r-ss; else if(dr>ds)r=-q-ss;
  return [q,r];
}
function axialCenter(q,r,s){return [s*(Math.sqrt(3)*q+Math.sqrt(3)/2*r), s*1.5*r];}

const cellByQR=new Map(), cells=[];
for(const n of sensors){
  const [q,r]=worldToAxial(n.x,n.y,CELL_R);
  const k=q+"_"+r;
  if(!cellByQR.has(k)){
    const [cx,cy]=axialCenter(q,r,CELL_R);
    cellByQR.set(k,cells.length);
    cells.push({id:cells.length,q,r,cx,cy,members:[],adj:new Set(),color:0,leader:-1});
  }
  n.cell=cellByQR.get(k);
  cells[n.cell].members.push(n);
}
/* neighbors + cell adjacency (radio-based, 80 m) */
for(let a=0;a<sensors.length;a++)for(let b=a+1;b<sensors.length;b++){
  const A=sensors[a],B=sensors[b];
  if(Math.hypot(A.x-B.x,A.y-B.y)<=NEIGH_R && A.cell!==B.cell){
    cells[A.cell].adj.add(B.cell); cells[B.cell].adj.add(A.cell);
  }
}
/* leader = closest to member centroid (tie -> lowest id) */
for(const c of cells){
  let gx=0,gy=0; c.members.forEach(m=>{gx+=m.x;gy+=m.y});
  gx/=c.members.length; gy/=c.members.length;
  let best=1e18;
  for(const m of c.members){
    const d=Math.hypot(m.x-gx,m.y-gy);
    if(d<best-1e-9||(Math.abs(d-best)<=1e-9&&m.id<c.leader)){best=d;c.leader=m.id;}
  }
}
/* greedy coloring ascending id (adjacent cells differ) */
for(const c of cells){
  const used=new Set();
  for(const a of c.adj) if(a<c.id) used.add(cells[a].color);
  let col=0; while(used.has(col))col++;
  c.color=col;
}
const CELL_FILLS=["--cellA","--cellB","--cellC","--cellD","--cellE","--cellF"];

/* ---------- UAV tracks ---------- */
const uavs={};
for(const r of TRAJ){ (uavs[r.id]??={id:r.id,role:r.role,pts:[]}).pts.push(r); }
Object.values(uavs).forEach(u=>u.pts.sort((a,b)=>a.t-b.t));
function uavPos(u,t){
  const p=u.pts;
  if(t<=p[0].t)return p[0];
  if(t>=p[p.length-1].t)return p[p.length-1];
  let lo=0,hi=p.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;(p[m].t<=t?lo=m:hi=m);}
  const a=p[lo],b=p[hi],f=(t-a.t)/(b.t-a.t||1);
  return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f,
          hd:Math.atan2(b.y-a.y,b.x-a.x)};
}

/* ---------- time range & milestones ---------- */
const T0=Math.min(...TRAJ.map(r=>r.t)), T1=Math.max(...TRAJ.map(r=>r.t),...EVENTS.map(e=>e.t));
const M={report:+METRICS.timeToReportAtBS_s, localize:+METRICS.timeToLocalize_s,
         complete:+METRICS.timeToCompleteData_s};
function fmt(v){return v<0?"—":v.toFixed(2);}
document.getElementById("runinfo").textContent =
  `scheme=${METRICS.scheme} · seed=${METRICS.seed} · grid ${GRID}×${GRID} (${sensors.length} sensors) · ${NUMUAV} UAV · victim node ${TARGET} · region ${METRICS.regionCells} cells (intra ${METRICS.intraShares} / inter ${METRICS.interShares} shares)`;
document.getElementById("miles").innerHTML = `
  <div class="tile primary"><div class="lbl">Report tới BS (chính)</div><div class="val">${fmt(M.report)}<small> s</small></div></div>
  <div class="tile"><div class="lbl">Khoanh vùng (summon)</div><div class="val">${fmt(M.localize)}<small> s</small></div></div>
  <div class="tile"><div class="lbl">Nhận đủ dữ liệu</div><div class="val">${fmt(M.complete)}<small> s</small></div></div>
  <div class="tile"><div class="lbl">Vùng manh mối</div><div class="val">${METRICS.regionCells}<small> cell</small></div></div>`;

/* metrics panel */
const MLBL={timeToReportAtBS_s:"Report @BS (s)",timeToLocalize_s:"Localize (s)",
  timeToCompleteData_s:"Complete data (s)",regionCells:"Region cells",
  intraShares:"Intra-cell shares",interShares:"Inter-cell shares",
  beaconCount:"Beacons",custodyHandoffs:"Custody handoffs",
  pktSent:"Pkt sent",pktRecv:"Pkt recv",bytesRecv:"Bytes recv",
  uavEnergyJ:"UAV energy (J)",routeDeviation_m:"Route deviation (m)"};
document.getElementById("metrics").innerHTML =
  Object.entries(MLBL).map(([k,l])=>
    `<span class="k">${l}</span><span class="v">${(METRICS[k]===undefined||METRICS[k]==="-1.0000")?"—":METRICS[k]}</span>`).join("");

/* event log */
const EV_COLOR={takeoff:"var(--muted)",summon_start:"var(--cl)",divert:"var(--data)",
  deliver_start:"var(--data)",confirm:"var(--victim)",report_tx:"var(--fast)",
  report_rx:"var(--good)",clue_report:"var(--evd)",share:"var(--share)",
  cue_rx:"var(--fast)",report_pickup:"var(--fast)",return_yield:"var(--data)"};

/* ---------- clue-propagation layers (all from radio-delivered events) -------
   REPORTS : a node's evidence physically reached its Cell Leader (RPT chain)
   SHARES  : a cell's aggregate crossed a boundary (SHARE flood, CL heard it)
   SUMMONS : the elected leader + its interpolated delivery target            */
const REPORTS=EVENTS.filter(e=>e.ev==="clue_report").map(e=>{
  const m=/ev=([\d.]+)/.exec(e.det||"");
  return {t:e.t,id:e.id,evv:m?+m[1]:0,x:e.x,y:e.y};
});
const SHARES=EVENTS.filter(e=>e.ev==="share").map(e=>{
  const m=/c(-?\d+) -> c(-?\d+)/.exec(e.det||"");
  return {t:e.t,from:m?+m[1]:-1,to:m?+m[2]:-1};
});
const SUMMONS=EVENTS.filter(e=>e.ev==="summon_start").map(e=>{
  const m=/target=([-\d.]+);([-\d.]+)/.exec(e.det||"");
  return {t:e.t,id:e.id,tx:m?+m[1]:e.x,ty:m?+m[2]:e.y};
});
const sensorById=new Map(sensors.map(s=>[s.id,s]));
const logEl=document.getElementById("log");
logEl.innerHTML=EVENTS.map((e,i)=>
  `<div class="row" data-t="${e.t}" data-i="${i}">
     <span class="tt">${e.t.toFixed(2)}s</span>
     <span class="dot" style="background:${EV_COLOR[e.ev]||"var(--muted)"}"></span>
     <span><b>${e.ev}</b> · ${e.role}[${e.id}]${e.det?" — "+e.det:""}</span></div>`).join("");
logEl.addEventListener("click",ev=>{
  const r=ev.target.closest(".row"); if(r) setT(+r.dataset.t);
});

/* ---------- canvas ---------- */
const cv=document.getElementById("map"), ctx=cv.getContext("2d");
const tip=document.getElementById("tip");
let view={};
function cssVar(n){return getComputedStyle(document.body).getPropertyValue(n).trim();}
function resize(){
  const w=cv.clientWidth, h=460;
  cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio; cv.style.height=h+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const xs=[BS.x,...sensors.map(s=>s.x),...cells.map(c=>c.cx)],
        ys=[BS.y,...sensors.map(s=>s.y),...cells.map(c=>c.cy)];
  const x0=Math.min(...xs)-60,x1=Math.max(...xs)+60,
        y0=Math.min(...ys)-60,y1=Math.max(...ys)+60;
  const sc=Math.min(w/(x1-x0),h/(y1-y0));
  view={sc,ox:(w-(x1-x0)*sc)/2 - x0*sc, oy:h+((y0)*sc)-(h-(y1-y0)*sc)/2};
  view.wx=x=>view.ox+x*view.sc;
  view.wy=y=>view.oy-y*view.sc;   /* flip y */
}
function hexPath(c){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    const px=view.wx(c.cx+CELL_R*Math.cos(a)), py=view.wy(c.cy+CELL_R*Math.sin(a));
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
let curT=T0;
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  /* cells */
  for(const c of cells){
    hexPath(c);
    ctx.fillStyle=cssVar(CELL_FILLS[c.color%CELL_FILLS.length]);
    ctx.fill();
    ctx.strokeStyle=cssVar("--border"); ctx.lineWidth=1; ctx.stroke();
  }
  /* sensors */
  for(const s of sensors){
    ctx.fillStyle=cssVar("--muted");
    ctx.fillRect(view.wx(s.x)-2.5,view.wy(s.y)-2.5,5,5);
  }
  /* ---- clue propagation: evidence tint (nodes whose report REACHED a CL) ---- */
  const evNow=new Map();
  for(const r of REPORTS){ if(r.t>curT)break;
    const p=evNow.get(r.id); if(!p||r.evv>p) evNow.set(r.id,r.evv); }
  for(const [nid,evv] of evNow){
    const s=sensorById.get(nid); if(!s)continue;
    ctx.beginPath();ctx.arc(view.wx(s.x),view.wy(s.y),3.5+3*evv,0,7);
    ctx.fillStyle=cssVar("--evd");ctx.globalAlpha=.30+.55*Math.min(1,evv);
    ctx.fill();ctx.globalAlpha=1;
  }
  /* ---- clue propagation: RPT pulses node -> its Cell Leader (1.6 s tail) ---- */
  for(const r of REPORTS){
    const dt=curT-r.t; if(dt<0||dt>1.6)continue;
    const s=sensorById.get(r.id); if(!s)continue;
    const L=sensorById.get(cells[s.cell].leader); if(!L)continue;
    const f=dt/1.6;
    ctx.beginPath();ctx.moveTo(view.wx(s.x),view.wy(s.y));ctx.lineTo(view.wx(L.x),view.wy(L.y));
    ctx.strokeStyle=cssVar("--evd");ctx.globalAlpha=.7*(1-f);ctx.lineWidth=1.5;ctx.stroke();
    const mx=s.x+(L.x-s.x)*f, my=s.y+(L.y-s.y)*f;      /* packet dot climbing the tree */
    ctx.beginPath();ctx.arc(view.wx(mx),view.wy(my),3,0,7);
    ctx.fillStyle=cssVar("--evd");ctx.globalAlpha=1-f;ctx.fill();ctx.globalAlpha=1;
  }
  /* ---- clue propagation: SHARE waves CL -> CL across the boundary (2.4 s) ---- */
  for(const sh of SHARES){
    const dt=curT-sh.t; if(dt<0||dt>2.4)continue;
    const A=cells[sh.from],B=cells[sh.to]; if(!A||!B)continue;
    const f=dt/2.4;
    ctx.beginPath();ctx.moveTo(view.wx(A.cx),view.wy(A.cy));
    const midx=(A.cx+B.cx)/2, midy=(A.cy+B.cy)/2+30;   /* slight arc */
    ctx.quadraticCurveTo(view.wx(midx),view.wy(midy),view.wx(B.cx),view.wy(B.cy));
    ctx.strokeStyle=cssVar("--share");ctx.globalAlpha=.75*(1-f);ctx.lineWidth=2;ctx.stroke();
    const q=1-f, px=q*q*A.cx+2*q*f*midx+f*f*B.cx, py=q*q*A.cy+2*q*f*midy+f*f*B.cy;
    ctx.beginPath();ctx.arc(view.wx(px),view.wy(py),3.5,0,7);
    ctx.fillStyle=cssVar("--share");ctx.globalAlpha=1-f;ctx.fill();ctx.globalAlpha=1;
  }
  /* ---- region + delivery target after the summon ---- */
  for(const sm of SUMMONS){
    if(sm.t>curT)break;
    const ls=sensorById.get(sm.id); if(!ls)continue;
    const lc=cells[ls.cell];
    const region=new Set([lc.id]);
    for(const sh of SHARES) if(sh.t<=sm.t&&sh.to===lc.id) region.add(sh.from);
    for(const cid of region){ const c=cells[cid]; if(!c)continue;
      hexPath(c);ctx.strokeStyle=cssVar("--victim");ctx.globalAlpha=.8;
      ctx.lineWidth=2.5;ctx.stroke();ctx.globalAlpha=1; }
    const bl=4+2*Math.abs(Math.sin(performance.now()/300));
    const tx=view.wx(sm.tx),ty=view.wy(sm.ty);
    ctx.strokeStyle=cssVar("--victim");ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(tx-8-bl,ty);ctx.lineTo(tx+8+bl,ty);
    ctx.moveTo(tx,ty-8-bl);ctx.lineTo(tx,ty+8+bl);ctx.stroke();
    ctx.beginPath();ctx.arc(tx,ty,6,0,7);ctx.stroke();
    break;   /* first summon defines the mission region */
  }
  /* cell leaders */
  for(const c of cells){
    const L=sensors.find(s=>s.id===c.leader);
    ctx.beginPath();ctx.arc(view.wx(L.x),view.wy(L.y),5.5,0,7);
    ctx.fillStyle=cssVar("--cl");ctx.fill();
    ctx.strokeStyle=cssVar("--surface");ctx.lineWidth=2;ctx.stroke();
  }
  /* victim pulsing ring */
  const V=sensors.find(s=>s.id===TARGET);
  const pulse=3+2*Math.abs(Math.sin(performance.now()/400));
  ctx.beginPath();ctx.arc(view.wx(V.x),view.wy(V.y),6+pulse,0,7);
  ctx.strokeStyle=cssVar("--victim");ctx.lineWidth=2.5;ctx.stroke();
  /* BS */
  ctx.fillStyle=cssVar("--bs");
  ctx.fillRect(view.wx(BS.x)-6,view.wy(BS.y)-6,12,12);
  ctx.fillStyle=cssVar("--text2");ctx.font="11px sans-serif";ctx.textAlign="center";
  ctx.fillText("BS",view.wx(BS.x),view.wy(BS.y)+20);
  /* UAV trails + markers */
  for(const u of Object.values(uavs)){
    const col=cssVar(u.role==="FAST"?"--fast":"--data");
    ctx.beginPath();
    let started=false;
    for(const p of u.pts){
      if(p.t>curT)break;
      const px=view.wx(p.x),py=view.wy(p.y);
      started?ctx.lineTo(px,py):(ctx.moveTo(px,py),started=true);
    }
    ctx.strokeStyle=col;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
    const pos=uavPos(u,curT), px=view.wx(pos.x),py=view.wy(pos.y);
    const hd=-(pos.hd??0);
    ctx.save();ctx.translate(px,py);ctx.rotate(hd+Math.PI/2);
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(6,7);ctx.lineTo(-6,7);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle=cssVar("--surface");ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
    ctx.fillStyle=cssVar("--text");ctx.font="bold 10.5px sans-serif";ctx.textAlign="center";
    ctx.fillText(u.role+"-"+u.id,px,py-12);
  }
  /* event pops (within 1.2 s after firing) */
  for(const e of EVENTS){
    if(e.ev==="takeoff")continue;
    const dt=curT-e.t;
    if(dt>=0&&dt<1.2){
      const r=8+dt*22, a=1-dt/1.2;
      ctx.beginPath();ctx.arc(view.wx(e.x),view.wy(e.y),r,0,7);
      ctx.globalAlpha=a*.8;
      ctx.strokeStyle=EV_COLOR[e.ev]?.startsWith("var")?cssVar(EV_COLOR[e.ev].slice(4,-1)):cssVar("--muted");
      ctx.lineWidth=2.5;ctx.stroke();ctx.globalAlpha=1;
    }
  }
  /* time + milestone markers on scrub handled by input; label */
  document.getElementById("tlabel").textContent=curT.toFixed(1)+" s";
  /* dim future rows in log */
  document.querySelectorAll("#log .row").forEach(r=>{
    r.classList.toggle("future",+r.dataset.t>curT);
  });
}

/* ---------- playback ---------- */
const scrub=document.getElementById("scrub"), playBtn=document.getElementById("play");
let playing=false,lastFrame=0;
function setT(t){curT=Math.max(T0,Math.min(T1,t));scrub.value=1000*(curT-T0)/(T1-T0);}
scrub.addEventListener("input",()=>{curT=T0+(T1-T0)*scrub.value/1000;});
playBtn.addEventListener("click",()=>{playing=!playing;playBtn.textContent=playing?"Pause":"Play";
  if(playing&&curT>=T1-0.01)setT(T0); lastFrame=performance.now();});
function loop(now){
  if(playing){
    const sp=+document.getElementById("speed").value;
    curT+=(now-lastFrame)/1000*sp;
    if(curT>=T1){curT=T1;playing=false;playBtn.textContent="Play";}
    scrub.value=1000*(curT-T0)/(T1-T0);
  }
  lastFrame=now;draw();requestAnimationFrame(loop);
}

/* ---------- hover tooltip ---------- */
cv.addEventListener("mousemove",ev=>{
  const rect=cv.getBoundingClientRect(), mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
  let html=null;
  for(const u of Object.values(uavs)){
    const p=uavPos(u,curT);
    if(Math.hypot(view.wx(p.x)-mx,view.wy(p.y)-my)<12){
      html=`<b>${u.role} UAV ${u.id}</b><br>(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) m`;break;
    }
  }
  if(!html)for(const s of sensors){
    if(Math.hypot(view.wx(s.x)-mx,view.wy(s.y)-my)<7){
      const c=cells[s.cell];
      html=`<b>sensor ${s.id}</b>${s.id===TARGET?" — <b style='color:var(--victim)'>VICTIM</b>":""}${s.id===c.leader?" — Cell Leader":""}<br>cell ${c.id} (q=${c.q},r=${c.r}) · pos (${s.x},${s.y})`;break;
    }
  }
  if(html){tip.innerHTML=html;tip.style.display="block";
    tip.style.left=(ev.clientX+14)+"px";tip.style.top=(ev.clientY+10)+"px";}
  else tip.style.display="none";
});
cv.addEventListener("mouseleave",()=>tip.style.display="none");

window.addEventListener("resize",()=>{resize();});
resize();setT(T0);requestAnimationFrame(loop);
</script>
</body>
</html>
