let t=0,p=false,zm=200,ox=0,oy=0;
c.width=c.offsetWidth;c.height=c.offsetHeight;
window.addEventListener('resize',()=>{c.width=c.offsetWidth;c.height=c.offsetHeight;});
c.addEventListener('wheel',(e)=>{e.preventDefault();const oldZm=zm;zm*=e.deltaY<0?1.1:0.9;zm=Math.max(0.1,Math.min(500,zm));const zoomFactor=zm/oldZm;ox=e.x+(ox-e.x)*zoomFactor;oy=e.y+(oy-e.y)*zoomFactor;document.getElementById('zoomLabel').textContent=(zm/10).toFixed(0)+'x';render();});
let dx=0,dy=0;
c.addEventListener('mousedown',(e)=>{dx=e.x;dy=e.y;});
c.addEventListener('mousemove',(e)=>{if(e.buttons){ox+=e.x-dx;oy+=e.y-dy;dx=e.x;dy=e.y;render();}});
function zoomIn(){const oldZm=zm;zm=Math.min(500,zm*1.2);const zoomFactor=zm/oldZm;ox=c.width/2+(ox-c.width/2)*zoomFactor;oy=c.height/2+(oy-c.height/2)*zoomFactor;document.getElementById('zoomLabel').textContent=(zm/10).toFixed(0)+'x';render();}
function zoomOut(){const oldZm=zm;zm=Math.max(0.1,zm/1.2);const zoomFactor=zm/oldZm;ox=c.width/2+(ox-c.width/2)*zoomFactor;oy=c.height/2+(oy-c.height/2)*zoomFactor;document.getElementById('zoomLabel').textContent=(zm/10).toFixed(0)+'x';render();}
function gp(x,y){
const g=d.config.gridSize;const s=d.config.gridSpacing;
const gridMax=s*(g-1);const pd=10;
const baseW=c.width-2*pd;const baseH=c.height-2*pd;
const sc=Math.min(baseW,baseH)/gridMax*zm;
const offsetX=ox+pd+(gridMax/2)*sc/s;
const offsetY=oy+pd+(gridMax/2)*sc/s;
return{x:offsetX+x*sc/s,y:offsetY+y*sc/s};}
function render(){
ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,c.width,c.height);
const g=d.config.gridSize;const s=d.config.gridSpacing;
if(document.getElementById('c1').checked){
ctx.strokeStyle='#444';ctx.lineWidth=0.5;
for(let i=0;i<g;i++){const p1=gp(0,i*s);const p2=gp((g-1)*s,i*s);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
for(let i=0;i<g;i++){const p3=gp(i*s,0);const p4=gp(i*s,(g-1)*s);ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.stroke();}}
if(document.getElementById('c6').checked&&d.packets){
ctx.fillStyle='rgba(255,0,0,0.4)';ctx.strokeStyle='#FF0000';ctx.lineWidth=1.5;
for(let pk of d.packets){
if(pk.t>t)break;
if(!pk.success){const dst=d.nodes[pk.dst];if(dst){
const p=gp(dst.x,dst.y);
if(p.x>-50&&p.x<c.width+50&&p.y>-50&&p.y<c.height+50){
ctx.beginPath();ctx.moveTo(p.x-4,p.y-4);ctx.lineTo(p.x+4,p.y+4);ctx.stroke();
ctx.beginPath();ctx.moveTo(p.x+4,p.y-4);ctx.lineTo(p.x-4,p.y+4);ctx.stroke();}}}}}
if(document.getElementById('c5').checked&&d.packets){
const fadeWindow=2.0;
for(let pk of d.packets){
if(pk.t>t)break;
const dst=d.nodes[pk.dst];
if(dst){
const age=t-pk.t;const fadeFactor=Math.max(0,1-age/fadeWindow);
const alpha=Math.max(0.1,fadeFactor*0.8);
if(pk.type==='uav'){ctx.strokeStyle=pk.success?`rgba(100,200,100,${alpha})`:`rgba(255,100,100,${alpha})`;}
else if(pk.type==='g2g'){ctx.strokeStyle=pk.success?`rgba(255,255,100,${alpha})`:`rgba(200,150,100,${alpha})`;}
ctx.lineWidth=1.5;
const p1=gp(pk.srcX,pk.srcY);const p2=gp(dst.x,dst.y);
ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}}}
ctx.fillStyle='#FFFF00';ctx.font='12px monospace';
ctx.fillText('TX:'+d.packets.length+' t='+t.toFixed(1)+'s',10,20);
if(document.getElementById('c3').checked){
const uavColors=['#667eea','#ff7043','#26c6da','#66bb6a','#ffa726'];
const trajs=d.uavTrajectories||{'0':d.uavTrajectory};
for(const uid in trajs){
const traj=trajs[uid];const col=uavColors[parseInt(uid)%uavColors.length];
ctx.strokeStyle=col;ctx.lineWidth=2;ctx.globalAlpha=0.6;ctx.beginPath();let f=true;
for(let pt of traj){if(pt.t>t)break;const p=gp(pt.x,pt.y);if(f){ctx.moveTo(p.x,p.y);f=false;}else{ctx.lineTo(p.x,p.y);}}
ctx.stroke();}
ctx.globalAlpha=1;}
if(document.getElementById('c2').checked){
const nodeFrags={};
if(d.nodeStates){for(let s of d.nodeStates){if(s.t>t)break;nodeFrags[s.id]=s.frags;}}
else{for(let pk of d.packets){if(pk.t>t)break;if(pk.success){if(!nodeFrags[pk.dst])nodeFrags[pk.dst]=new Set();nodeFrags[pk.dst].add(pk.fragId);}}}
for(let nid in d.nodes){
const n=d.nodes[nid];if(!n)continue;
const p=gp(n.x,n.y);
if(p.x>-50&&p.x<c.width+50&&p.y>-50&&p.y<c.height+50){
let col='#4A5B7F';let r=6;
const fragCount=(nodeFrags[nid] instanceof Set)?nodeFrags[nid].size:(nodeFrags[nid]||0);
if(fragCount>0){
const maxFrags=d.config.numFragments;
const ratio=Math.min(1,fragCount/maxFrags);
const hue=Math.floor(240-ratio*240);
col=`hsl(${hue},60%,55%)`;r=6+ratio*2;}
ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
if(n.isDetectionNode){ctx.strokeStyle='#C85A54';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,r+3,0,Math.PI*2);ctx.stroke();}
if(document.getElementById('c4').checked&&n.isCandidate){ctx.strokeStyle='#9E8C42';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r+2,0,Math.PI*2);ctx.stroke();}}}
}
const uavColors2=['#667eea','#ff7043','#26c6da','#66bb6a','#ffa726'];
const trajs2=d.uavTrajectories||{'0':d.uavTrajectory};
for(const uid in trajs2){
const traj=trajs2[uid];const col2=uavColors2[parseInt(uid)%uavColors2.length];
let up=null;
for(let i=0;i<traj.length;i++){
if(traj[i].t>t){
if(i>0){const p1=traj[i-1];const p2=traj[i];const tt=(t-p1.t)/(p2.t-p1.t);up={x:p1.x+(p2.x-p1.x)*tt,y:p1.y+(p2.y-p1.y)*tt};}
break;}}
if(!up&&traj.length>0)up=traj[traj.length-1];
if(up){
const p=gp(up.x,up.y);
if(p.x>-50&&p.x<c.width+50&&p.y>-50&&p.y<c.height+50){
ctx.fillStyle=col2;ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();
ctx.strokeStyle=col2+'44';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='white';ctx.font='9px monospace';ctx.fillText('U'+uid,p.x-5,p.y+3);}}}
}
function upd(){
document.getElementById('timeLabel').textContent=t.toFixed(1);
document.getElementById('maxLabel').textContent=d.config.simTime.toFixed(1);
document.getElementById('slider').max=d.config.simTime;
document.getElementById('info1').textContent=d.config.detected?'Detected':'Not detected';
if(d.config.detected)document.getElementById('info1').textContent+=' @ '+d.config.detectionTime.toFixed(1)+'s';
document.getElementById('info2').textContent='Path: '+d.config.uavPathLength.toFixed(0)+'m';
render();}
function anim(){if(p){t+=0.05;if(t>=d.config.simTime)p=false;document.getElementById('slider').value=t;upd();}requestAnimationFrame(anim);}
function play(){p=true;}
function pause(){p=false;}
function reset(){t=0;p=false;ox=0;oy=0;zm=200;document.getElementById('slider').value=0;document.getElementById('zoomLabel').textContent='20x';upd();}
function seek(v){t=parseFloat(v);upd();}
function exp(){const j=JSON.stringify(d,null,2);const b=new Blob([j],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='wsn-uav-result.json';a.click();URL.revokeObjectURL(u);}
upd();anim();
</script></body></html>
