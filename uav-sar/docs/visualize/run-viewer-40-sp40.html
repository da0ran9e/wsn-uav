<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAV-SAR Mission Replay — 40×40 · spacing 40 m</title>
<style>
:root{
  --surface:#fcfcfb; --panel:#f4f4f2; --border:#e2e1dd;
  --text:#0b0b0b; --text2:#52514e; --muted:#8a8983;
  --fast:#2a78d6; --data:#1baf7a; --cl:#4a3aa7; --victim:#e34948;
  --bs:#0b0b0b; --good:#008300; --accent:#2a78d6; --warn:#eda100;
  --cellA:rgba(237,161,0,.09); --cellB:rgba(42,120,214,.07);
  --cellC:rgba(232,123,164,.09); --cellD:rgba(0,131,0,.07);
  --cellE:rgba(74,58,167,.07);  --cellF:rgba(235,104,52,.09);
  --covered:rgba(42,120,214,.85);
  --regionFill:rgba(74,58,167,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#1a1a19; --panel:#222220; --border:#3a3936;
    --text:#ffffff; --text2:#c3c2b7; --muted:#8a8983;
    --fast:#3987e5; --data:#199e70; --cl:#9085e9; --victim:#e66767;
    --bs:#e8e7e0; --good:#35c07e; --accent:#3987e5; --warn:#c98500;
    --cellA:rgba(201,133,0,.12); --cellB:rgba(57,135,229,.10);
    --cellC:rgba(213,81,129,.11); --cellD:rgba(53,192,126,.09);
    --cellE:rgba(144,133,233,.10); --cellF:rgba(217,89,38,.11);
    --covered:rgba(57,135,229,.9);
    --regionFill:rgba(144,133,233,.22);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);
  font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;padding:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:10px}
header h1{font-size:17px;font-weight:650}
header .sub{color:var(--text2);font-size:12.5px}
.milestones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 14px;min-width:128px}
.tile .lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile.primary .val{color:var(--good)}
.tile .val small{font-size:12px;font-weight:400;color:var(--text2)}
.layout{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.mapwrap{flex:1 1 640px;min-width:340px;display:flex;flex-direction:column;gap:8px}
canvas{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);display:block;cursor:grab}
canvas.drag{cursor:grabbing}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 16px;font-weight:600;font-size:13px;cursor:pointer}
.controls input[type=range]{flex:1;min-width:150px;accent-color:var(--accent)}
.controls .t{font-variant-numeric:tabular-nums;font-weight:600;min-width:78px}
.controls select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.hint{font-size:11.5px;color:var(--muted)}
.side{flex:0 1 340px;min-width:290px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:7px 13px;font-size:12px}
.legend .it{display:flex;align-items:center;gap:6px;color:var(--text2)}
.sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.sw.ring{background:transparent;border:2.5px solid var(--victim);border-radius:50%}
.sw.line{width:16px;height:0;border-top:2.5px dashed var(--cl);border-radius:0}
.sw.linea{border-top:2.5px dashed var(--data)}
#filters{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12px;margin-bottom:6px}
#filters label{display:flex;gap:4px;align-items:center;color:var(--text2);cursor:pointer}
#log{max-height:280px;overflow-y:auto;font-size:12.5px}
#log .row{display:flex;gap:8px;padding:3.5px 6px;border-radius:5px;cursor:pointer;align-items:baseline}
#log .row:hover{background:var(--border)}
#log .row.future{opacity:.35}
#log .tt{font-variant-numeric:tabular-nums;color:var(--text2);min-width:56px}
#log .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;position:relative;top:1px}
#metrics{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px}
#metrics .k{color:var(--text2)} #metrics .v{font-variant-numeric:tabular-nums;text-align:right}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:9;max-width:240px;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
</style>
</head>

</div>

<script>
"use strict";
/* ---------- parse ---------- */
function parseCsv(txt){
  const lines=txt.trim().split(/\r?\n/);const head=lines[0].split(",");
  return lines.slice(1).map(l=>{const c=l.split(",");const o={};head.forEach((h,i)=>o[h]=c[i]);return o;});
}
const METRICS=parseCsv(document.getElementById("csv-metrics").textContent)[0];
const EVENTS=parseCsv(document.getElementById("csv-events").textContent)
  .map(e=>({t:+e.t,id:+e.nodeId,role:e.role,ev:e.event,det:e.detail||"",x:+e.x,y:+e.y}));
const TRAJ=parseCsv(document.getElementById("csv-traj").textContent)
  .map(r=>({t:+r.t,id:+r.uavId,role:r.role,x:+r.x,y:+r.y}));

/* ---------- topology (same math as cell-grid.cc) ---------- */
const GRID=+METRICS.gridSize,SPACING=40,NUMUAV=+METRICS.numUav;
const FIRST_SENSOR=1+NUMUAV,TARGET=+METRICS.targetNodeId;
const CELL_R=80,BS={x:-200,y:-200};
const sensors=[],byId={};
for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){
  const s={id:FIRST_SENSOR+i*GRID+j,x:j*SPACING,y:i*SPACING};
  sensors.push(s);byId[s.id]=s;
}
function worldToAxial(x,y,s){
  const fq=(Math.sqrt(3)/3*x-y/3)/s,fr=(2/3*y)/s,fs=-fq-fr;
  let q=Math.round(fq),r=Math.round(fr),ss=Math.round(fs);
  const dq=Math.abs(q-fq),dr=Math.abs(r-fr),ds=Math.abs(ss-fs);
  if(dq>dr&&dq>ds)q=-r-ss;else if(dr>ds)r=-q-ss;
  return [q,r];
}
function axialCenter(q,r,s){return [s*(Math.sqrt(3)*q+Math.sqrt(3)/2*r),s*1.5*r];}
const cellByQR=new Map(),cells=[];
for(const n of sensors){
  const [q,r]=worldToAxial(n.x,n.y,CELL_R),k=q+"_"+r;
  if(!cellByQR.has(k)){
    const [cx,cy]=axialCenter(q,r,CELL_R);
    cellByQR.set(k,cells.length);
    cells.push({id:cells.length,q,r,cx,cy,members:[],adj:new Set(),color:0,leader:-1});
  }
  n.cell=cellByQR.get(k);cells[n.cell].members.push(n);
}
/* neighbor range derived from the G2G link budget in the sim (~37 m) */
const NEIGH_R=37;
for(let a=0;a<sensors.length;a++){
  const A=sensors[a];
  for(let b=a+1;b<sensors.length;b++){
    const B=sensors[b];
    if(B.x-A.x>NEIGH_R)break;   /* sensors sorted row-major; cheap x-prune within row pairs */
    if(Math.hypot(A.x-B.x,A.y-B.y)<=NEIGH_R&&A.cell!==B.cell){
      cells[A.cell].adj.add(B.cell);cells[B.cell].adj.add(A.cell);
    }
  }
}
/* row-major order breaks the x-prune across rows; do a correct second pass on
   vertical neighbours (same column, next rows) which the prune may have cut */
for(const A of sensors){
  for(let dr=1;dr*SPACING<=NEIGH_R;dr++){
    const idx=sensors.indexOf(A)+dr*GRID;
    if(idx>=sensors.length)break;
    const B=sensors[idx];
    if(Math.hypot(A.x-B.x,A.y-B.y)<=NEIGH_R&&A.cell!==B.cell){
      cells[A.cell].adj.add(B.cell);cells[B.cell].adj.add(A.cell);
    }
  }
}
for(const c of cells){
  let gx=0,gy=0;c.members.forEach(m=>{gx+=m.x;gy+=m.y});
  gx/=c.members.length;gy/=c.members.length;
  let best=1e18;
  for(const m of c.members){
    const d=Math.hypot(m.x-gx,m.y-gy);
    if(d<best-1e-9||(Math.abs(d-best)<=1e-9&&m.id<c.leader)){best=d;c.leader=m.id;}
  }
}
/* at 40 m spacing the radio graph is edgeless (range 37 m) so radio adjacency
   gives no coloring constraints; use geometric hex neighbours for the fill */
for(const c of cells){
  for(const [dq,dr] of [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]]){
    const k=(c.q+dq)+"_"+(c.r+dr);
    if(cellByQR.has(k))c.adj.add(cellByQR.get(k));
  }
}
for(const c of cells){
  const used=new Set();
  for(const a of c.adj)if(a<c.id)used.add(cells[a].color);
  let col=0;while(used.has(col))col++;c.color=col;
}
const CELL_FILLS=["--cellA","--cellB","--cellC","--cellD","--cellE","--cellF"];

/* ---------- events pre-processing ---------- */
const cueRxTime=new Map();
let regionEvt=null,verifierId=-1;const regionCellsQR=new Set();
const pulses=[];
const summon={start:-1,end:1e18,node:-1,x:0,y:0};
function parseDst(det){const m=det.match(/dst=(\d+)@(-?\d+);(-?\d+)/);return m?{id:+m[1],x:+m[2],y:+m[3]}:null;}
for(const e of EVENTS){
  switch(e.ev){
    case "cue_rx": cueRxTime.set(e.id,e.t); break;
    case "clue_report":{const d=parseDst(e.det);if(d)pulses.push({t:e.t,dur:1.5,x1:e.x,y1:e.y,x2:d.x,y2:d.y,kind:"report"});break;}
    case "share":{const d=parseDst(e.det);if(d)pulses.push({t:e.t,dur:2.5,x1:e.x,y1:e.y,x2:d.x,y2:d.y,kind:"share"});break;}
    case "region":{
      regionEvt=e;
      const cm=e.det.match(/cells=([\d;]+)/);
      if(cm)cm[1].split(";").forEach(c=>regionCellsQR.add(+c));
      const vm=e.det.match(/verifier=(\d+)/);if(vm)verifierId=+vm[1];
      break;}
    case "summon_start": summon.start=e.t;summon.node=e.id;summon.x=e.x;summon.y=e.y;break;
    case "confirm": if(summon.end>1e17)summon.end=e.t;break;
    case "a2a_relay": pulses.push({t:e.t,dur:1.6,x1:e.x,y1:e.y,kind:"a2a"});break;
    case "cue_tx": pulses.push({t:e.t,dur:1.0,x1:e.x,y1:e.y,kind:"cue"});break;
    case "full_tx": pulses.push({t:e.t,dur:1.0,x1:e.x,y1:e.y,kind:"full"});break;
    case "report_tx": pulses.push({t:e.t,dur:3.0,x1:e.x,y1:e.y,x2:BS.x,y2:BS.y,kind:"reportbs"});break;
  }
}
/* NOTE: the sim's cell ids (region event) come from ITS BuildCellGrid insertion
   order, which this page reproduces exactly (same node order, same math), so
   regionCellsQR ids match cells[].id here. */

/* ---------- UAV tracks ---------- */
const uavs={};
for(const r of TRAJ){(uavs[r.id]??={id:r.id,role:r.role,pts:[]}).pts.push(r);}
Object.values(uavs).forEach(u=>u.pts.sort((a,b)=>a.t-b.t));
function uavPos(u,t){
  const p=u.pts;
  if(t<=p[0].t)return p[0];
  if(t>=p[p.length-1].t)return p[p.length-1];
  let lo=0,hi=p.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;(p[m].t<=t?lo=m:hi=m);}
  const a=p[lo],b=p[hi],f=(t-a.t)/(b.t-a.t||1);
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,hd:Math.atan2(b.y-a.y,b.x-a.x)};
}
function nearestDataUav(t,x,y){
  let best=null,bd=1e18;
  for(const u of Object.values(uavs)){
    if(u.role!=="DATA")continue;
    const p=uavPos(u,t);
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=p;}
  }
  return best;
}

/* ---------- milestones ---------- */
const T0=Math.min(...TRAJ.map(r=>r.t)),T1=Math.max(...TRAJ.map(r=>r.t),...EVENTS.map(e=>e.t));
const M={report:+METRICS.timeToReportAtBS_s,localize:+METRICS.timeToLocalize_s,complete:+METRICS.timeToCompleteData_s};
const fmt=v=>v<0?"—":v.toFixed(2);
document.getElementById("runinfo").textContent=
 `scheme=${METRICS.scheme} · seed=${METRICS.seed} · spacing ${SPACING} m · grid ${GRID}×${GRID} (${sensors.length} sensors) · ${NUMUAV} UAV · victim node ${TARGET} · region ${METRICS.regionCells} cells (inter ${METRICS.interShares} shares)`;
document.getElementById("miles").innerHTML=`
 <div class="tile primary"><div class="lbl">Report tới BS (chính)</div><div class="val">${fmt(M.report)}<small> s</small></div></div>
 <div class="tile"><div class="lbl">Khoanh vùng</div><div class="val">${fmt(M.localize)}<small> s</small></div></div>
 <div class="tile"><div class="lbl">Verifier nhận đủ</div><div class="val">${summon.end<1e17?summon.end.toFixed(2):"—"}<small> s</small></div></div>
 <div class="tile"><div class="lbl">Vùng manh mối</div><div class="val">${METRICS.regionCells}<small> cell</small></div></div>`;
const MLBL={timeToReportAtBS_s:"Report @BS (s)",timeToLocalize_s:"Localize (s)",
 timeToCompleteData_s:"Strict complete (s)",regionCells:"Region cells",
 intraShares:"Intra shares",interShares:"Inter shares",beaconCount:"Beacons",
 custodyHandoffs:"Custody",bytesSent:"Bytes sent",bytesRecv:"Bytes recv",
 uavEnergyJ:"UAV energy (J)",routeDeviation_m:"Deviation (m)"};
document.getElementById("metrics").innerHTML=Object.entries(MLBL).map(([k,l])=>
 `<span class="k">${l}</span><span class="v">${(METRICS[k]===undefined||METRICS[k]==="-1.0000")?"—":METRICS[k]}</span>`).join("");

/* ---------- event log with filters ---------- */
const EV_COLOR={takeoff:"var(--muted)",summon_start:"var(--cl)",divert:"var(--data)",
 deliver_start:"var(--data)",confirm:"var(--victim)",report_tx:"var(--warn)",
 report_rx:"var(--good)",report_pickup:"var(--warn)",region:"var(--cl)",share:"var(--cl)",a2a_relay:"var(--data)",
 clue_report:"var(--cl)",cue_rx:"var(--fast)",cue_tx:"var(--fast)",full_tx:"var(--data)"};
const GROUPS={ "mốc":["takeoff","summon_start","divert","deliver_start","confirm","report_tx","report_rx","report_pickup","region"],
 "khoanh vùng":["clue_report","share"], "packet A2A":["a2a_relay"],
 "packet A2G":["cue_tx","full_tx"], "phủ sóng":["cue_rx"] };
const activeGroups=new Set(["mốc","khoanh vùng","packet A2A"]);
const filtersEl=document.getElementById("filters");
filtersEl.innerHTML=Object.keys(GROUPS).map(g=>
 `<label><input type="checkbox" data-g="${g}" ${activeGroups.has(g)?"checked":""}>${g}</label>`).join("");
filtersEl.addEventListener("change",e=>{
  const g=e.target.dataset.g;
  e.target.checked?activeGroups.add(g):activeGroups.delete(g);
  renderLog();
});
function evGroup(ev){for(const [g,list] of Object.entries(GROUPS))if(list.includes(ev))return g;return "mốc";}
const logEl=document.getElementById("log");
function renderLog(){
  const vis=EVENTS.filter(e=>activeGroups.has(evGroup(e.ev)));
  logEl.innerHTML=vis.map(e=>
   `<div class="row" data-t="${e.t}">
      <span class="tt">${e.t.toFixed(2)}s</span>
      <span class="dot" style="background:${EV_COLOR[e.ev]||"var(--muted)"}"></span>
      <span><b>${e.ev}</b> · ${e.role}[${e.id}]${e.det?" — "+e.det:""}</span></div>`).join("");
}
renderLog();
logEl.addEventListener("click",ev=>{const r=ev.target.closest(".row");if(r)setT(+r.dataset.t);});

/* ---------- canvas + zoom/pan ---------- */
const cv=document.getElementById("map"),ctx=cv.getContext("2d");
const tip=document.getElementById("tip");
let base={sc:1,ox:0,oy:0},zoom=1,panX=0,panY=0;
function cssVar(n){return getComputedStyle(document.body).getPropertyValue(n).trim();}
function resize(){
  const w=cv.clientWidth,h=560;
  cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;cv.style.height=h+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const xs=[BS.x,...cells.map(c=>c.cx)],ys=[BS.y,...cells.map(c=>c.cy)];
  const x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-90,y1=Math.max(...ys)+90;
  base.sc=Math.min(w/(x1-x0),h/(y1-y0));
  base.ox=(w-(x1-x0)*base.sc)/2-x0*base.sc;
  base.oy=(h+(y1-y0)*base.sc)/2+y0*base.sc;
}
const W={
  x:x=>(base.ox+x*base.sc)*zoom+panX,
  y:y=>(base.oy-y*base.sc)*zoom+panY,
  s:v=>v*base.sc*zoom
};
function hexPath(c){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    const px=W.x(c.cx+CELL_R*Math.cos(a)),py=W.y(c.cy+CELL_R*Math.sin(a));
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
let curT=0;
function draw(){
  const w=cv.clientWidth,h=560;
  ctx.clearRect(0,0,w,h);
  const regionActive=regionEvt&&curT>=regionEvt.t;
  for(const c of cells){
    hexPath(c);
    if(regionActive&&regionCellsQR.has(c.id)){
      ctx.fillStyle=cssVar("--regionFill");ctx.fill();
      ctx.strokeStyle=cssVar("--cl");ctx.lineWidth=2;ctx.stroke();
    }else{
      ctx.fillStyle=cssVar(CELL_FILLS[c.color%CELL_FILLS.length]);ctx.fill();
      ctx.strokeStyle=cssVar("--border");ctx.lineWidth=1;ctx.stroke();
    }
  }
  const sz=Math.max(1.8,Math.min(4.5,W.s(7)));
  for(const s of sensors){
    const heard=cueRxTime.has(s.id)&&cueRxTime.get(s.id)<=curT;
    if(heard){ctx.fillStyle=cssVar("--covered");ctx.globalAlpha=0.85;}
    else{ctx.fillStyle=cssVar("--muted");ctx.globalAlpha=0.45;}
    ctx.fillRect(W.x(s.x)-sz/2,W.y(s.y)-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;
  for(const c of cells){
    const L=byId[c.leader];if(!L)continue;
    ctx.beginPath();ctx.arc(W.x(L.x),W.y(L.y),Math.max(2.5,W.s(4.5)),0,7);
    ctx.fillStyle=cssVar("--cl");ctx.fill();
    ctx.strokeStyle=cssVar("--surface");ctx.lineWidth=1.2;ctx.stroke();
  }
  if(regionActive&&byId[verifierId]){
    const v=byId[verifierId];
    ctx.beginPath();ctx.arc(W.x(v.x),W.y(v.y),Math.max(5,W.s(9)),0,7);
    ctx.strokeStyle=cssVar("--warn");ctx.lineWidth=2.5;ctx.stroke();
  }
  const V=byId[TARGET];
  if(V){
    const pulse=2+2*Math.abs(Math.sin(performance.now()/400));
    ctx.beginPath();ctx.arc(W.x(V.x),W.y(V.y),Math.max(5,W.s(7))+pulse,0,7);
    ctx.strokeStyle=cssVar("--victim");ctx.lineWidth=2.5;ctx.stroke();
  }
  if(summon.start>=0&&curT>=summon.start&&curT<=summon.end){
    const ph=(performance.now()/900)%1;
    ctx.beginPath();ctx.arc(W.x(summon.x),W.y(summon.y),8+ph*Math.max(30,W.s(70)),0,7);
    ctx.globalAlpha=0.7*(1-ph);
    ctx.strokeStyle=cssVar("--cl");ctx.lineWidth=2.5;ctx.stroke();ctx.globalAlpha=1;
  }
  ctx.fillStyle=cssVar("--bs");
  ctx.fillRect(W.x(BS.x)-6,W.y(BS.y)-6,12,12);
  ctx.fillStyle=cssVar("--text2");ctx.font="11px sans-serif";ctx.textAlign="center";
  ctx.fillText("BS",W.x(BS.x),W.y(BS.y)+20);
  for(const p of pulses){
    const dt=curT-p.t;
    if(dt<0||dt>p.dur)continue;
    const f=dt/p.dur,a=1-f;
    if(p.kind==="cue"||p.kind==="full"){
      ctx.beginPath();ctx.arc(W.x(p.x1),W.y(p.y1),4+f*Math.max(25,W.s(55)),0,7);
      ctx.globalAlpha=a*0.65;
      ctx.strokeStyle=cssVar(p.kind==="cue"?"--fast":"--data");
      ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
    }else if(p.kind==="a2a"){
      const d=nearestDataUav(p.t,p.x1,p.y1);
      if(d){
        ctx.setLineDash([6,5]);
        ctx.beginPath();ctx.moveTo(W.x(p.x1),W.y(p.y1));
        const prog=Math.min(1,f*1.4);
        ctx.lineTo(W.x(p.x1+(d.x-p.x1)*prog),W.y(p.y1+(d.y-p.y1)*prog));
        ctx.globalAlpha=a;ctx.strokeStyle=cssVar("--data");ctx.lineWidth=2.5;ctx.stroke();
        ctx.setLineDash([]);ctx.globalAlpha=1;
      }
    }else{
      const prog=Math.min(1,f*1.2);
      const mx=p.x1+(p.x2-p.x1)*prog,my=p.y1+(p.y2-p.y1)*prog;
      ctx.setLineDash(p.kind==="share"?[7,4]:[3,4]);
      ctx.beginPath();ctx.moveTo(W.x(p.x1),W.y(p.y1));ctx.lineTo(W.x(mx),W.y(my));
      ctx.globalAlpha=a;
      ctx.strokeStyle=cssVar(p.kind==="reportbs"?"--warn":"--cl");
      ctx.lineWidth=p.kind==="share"?3:2;ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(W.x(mx),W.y(my),3.5,0,7);
      ctx.fillStyle=cssVar(p.kind==="reportbs"?"--warn":"--cl");ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  if(regionActive){
    ctx.fillStyle=cssVar("--cl");ctx.font="bold 14px sans-serif";ctx.textAlign="center";
    ctx.fillText("✦",W.x(regionEvt.x),W.y(regionEvt.y)+5);
  }
  for(const u of Object.values(uavs)){
    const col=cssVar(u.role==="FAST"?"--fast":"--data");
    ctx.beginPath();let st=false;
    for(const p of u.pts){
      if(p.t>curT)break;
      const px=W.x(p.x),py=W.y(p.y);
      st?ctx.lineTo(px,py):(ctx.moveTo(px,py),st=true);
    }
    ctx.strokeStyle=col;ctx.globalAlpha=.3;ctx.lineWidth=1.6;ctx.stroke();ctx.globalAlpha=1;
    const pos=uavPos(u,curT),px=W.x(pos.x),py=W.y(pos.y);
    ctx.save();ctx.translate(px,py);ctx.rotate(-(pos.hd??0)+Math.PI/2);
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(6,7);ctx.lineTo(-6,7);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle=cssVar("--surface");ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    ctx.fillStyle=cssVar("--text");ctx.font="bold 10px sans-serif";ctx.textAlign="center";
    ctx.fillText(u.role+"-"+u.id,px,py-11);
  }
  document.getElementById("tlabel").textContent=curT.toFixed(1)+" s";
  document.querySelectorAll("#log .row").forEach(r=>r.classList.toggle("future",+r.dataset.t>curT));
}

/* ---------- playback ---------- */
const scrub=document.getElementById("scrub"),playBtn=document.getElementById("play");
let playing=false,lastFrame=0;
function setT(t){curT=Math.max(T0,Math.min(T1,t));scrub.value=1000*(curT-T0)/(T1-T0);}
scrub.addEventListener("input",()=>{curT=T0+(T1-T0)*scrub.value/1000;});
playBtn.addEventListener("click",()=>{playing=!playing;playBtn.textContent=playing?"Pause":"Play";
  if(playing&&curT>=T1-0.01)setT(T0);lastFrame=performance.now();});
function loop(now){
  if(playing){
    const sp=+document.getElementById("speed").value;
    curT+=(now-lastFrame)/1000*sp;
    if(curT>=T1){curT=T1;playing=false;playBtn.textContent="Play";}
    scrub.value=1000*(curT-T0)/(T1-T0);
  }
  lastFrame=now;draw();requestAnimationFrame(loop);
}

/* ---------- zoom / pan / tooltip ---------- */
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const k=e.deltaY<0?1.2:1/1.2,nz=Math.min(14,Math.max(0.5,zoom*k));
  panX=mx-(mx-panX)*(nz/zoom);panY=my-(my-panY)*(nz/zoom);zoom=nz;
},{passive:false});
let drag=null;
cv.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY};cv.classList.add("drag");});
window.addEventListener("mouseup",()=>{drag=null;cv.classList.remove("drag");});
cv.addEventListener("dblclick",()=>{zoom=1;panX=0;panY=0;});
cv.addEventListener("mousemove",e=>{
  if(drag){panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;return;}
  const rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let html=null;
  for(const u of Object.values(uavs)){
    const p=uavPos(u,curT);
    if(Math.hypot(W.x(p.x)-mx,W.y(p.y)-my)<12){
      html=`<b>${u.role} UAV ${u.id}</b><br>(${p.x.toFixed(0)}, ${p.y.toFixed(0)}) m`;break;
    }
  }
  if(!html)for(const s of sensors){
    if(Math.hypot(W.x(s.x)-mx,W.y(s.y)-my)<6){
      const c=cells[s.cell];
      const heard=cueRxTime.has(s.id)&&cueRxTime.get(s.id)<=curT;
      html=`<b>sensor ${s.id}</b>${s.id===TARGET?" — <b style='color:var(--victim)'>VICTIM</b>":""}${s.id===c.leader?" — Cell Leader":""}${s.id===verifierId?" — verifier":""}<br>cell ${c.id} (q=${c.q},r=${c.r})${heard?" · nghe cue @"+cueRxTime.get(s.id).toFixed(1)+"s":""}`;
      break;
    }
  }
  if(html){tip.innerHTML=html;tip.style.display="block";
    tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+10)+"px";}
  else tip.style.display="none";
});
cv.addEventListener("mouseleave",()=>tip.style.display="none");

window.addEventListener("resize",resize);
resize();setT(T0);requestAnimationFrame(loop);
</script>
</body>
</html>
