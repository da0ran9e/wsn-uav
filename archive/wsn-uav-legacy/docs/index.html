<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSN-UAV Log Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="visualize/styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand"><span class="brand-dot"></span>WSN-UAV Visualizer</div>
      <div class="meta">
        <span class="scenario" id="meta-scenario">No log loaded</span>
        <span class="path" id="meta-path">Choose a .md log to begin</span>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <input type="file" id="file-input" class="hidden-input" accept=".md,text/markdown">
        <button class="button-secondary" id="btn-load">Load log</button>
        <button class="button-secondary" id="btn-step">Step</button>
        <button class="button-secondary" id="btn-pause" disabled>Pause</button>
        <button class="button-primary" id="btn-play" disabled>Replay</button>
      </div>
    </header>

    <section class="canvas-region">
      <svg id="world" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"></path>
          </marker>
        </defs>
        <g id="g-grid"></g>
        <g id="g-trails"></g>
        <g id="g-arrows"></g>
        <g id="g-rings"></g>
        <g id="g-sensors"></g>
        <g id="g-bs"></g>
        <g id="g-uav"></g>
      </svg>
      <div class="canvas-overlay">
        <span class="legend-chip"><span class="swatch" style="background:var(--tint-sky);border:1px solid var(--link-blue)"></span>Sensor</span>
        <span class="legend-chip"><span class="swatch" style="background:var(--tint-lavender);border:1px solid var(--primary)"></span>Base Station</span>
        <span class="legend-chip"><span class="swatch" style="background:var(--primary)"></span>UAV</span>
      </div>
      <div class="empty-state" id="empty-state">
        <div class="title">No log loaded</div>
        <div class="sub">Click "Load log" or drop a <code>.md</code> file</div>
      </div>
    </section>

    <aside class="side">
      <div class="card-feature">
        <h3>Timeline</h3>
        <div class="scrubber-row">
          <input type="range" id="scrubber" min="0" max="100" step="0.01" value="0">
          <span class="time-readout" id="time-readout">0.000 / 0.000s</span>
        </div>
        <div class="speed-row" id="speed-row">
          <button class="speed-btn" data-speed="0.25">0.25×</button>
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="4">4×</button>
          <button class="speed-btn" data-speed="16">16×</button>
        </div>
      </div>

      <div class="card-feature">
        <h3>Event feed</h3>
        <div class="event-feed-controls" id="event-filters"></div>
        <div class="event-list" id="event-list"></div>
      </div>

      <div class="card-feature">
        <h3>Stats</h3>
        <div class="stat-row"><span class="label">TX events</span><span class="value" id="stat-tx">0</span></div>
        <div class="stat-row"><span class="label">RX events</span><span class="value" id="stat-rx">0</span></div>
        <div class="stat-row"><span class="label">Drops</span><span class="value" id="stat-drops">0</span></div>
        <div class="stat-row"><span class="label">UAV path</span><span class="value" id="stat-path">0.0 m</span></div>
        <div class="stat-row"><span class="label">Elapsed</span><span class="value" id="stat-elapsed">0.000 s</span></div>
      </div>
    </aside>
  </div>
  <script type="module" src="visualize/app.js"></script>
</body>
</html>
